# bash: extract backend config from JSON and assure DNS resolution
parameters:
  - name: name
    type: string
  - name: displayName
    type: string
#   - name: tfBackendConfigJSON
#     type: string
#     default: '{}'
  - name: tfBackendConfigJSONL0
    type: string
    default: '{}'
  - name: tfBackendConfigJSONL1
    type: string
    default: '{}'
  - name: tfBackendConfigJSONL2
    type: string
    default: '{}'
  - name: tfBackendConfigJSONL3
    type: string
    default: '{}'

steps:
  - task: Bash@3
    name: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    inputs:
      targetType: inline
      script: |
        #!/bin/bash
        set -euo pipefail

        HOSTS_FILE="/etc/hosts"
        LOOKUP_TIMEOUT=2

        LEVELS=(level0 level1 level2 level3)

        declare -A BACKEND_JSON=(
          [level0]='${{ parameters.tfBackendConfigJSONL0 }}'
          [level1]='${{ parameters.tfBackendConfigJSONL1 }}'
          [level2]='${{ parameters.tfBackendConfigJSONL2 }}'
          [level3]='${{ parameters.tfBackendConfigJSONL3 }}'
        )

        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT

        hosts_entry_present() {
          local ip="$1" fqdn="$2"
          grep -Eq "^[[:space:]]*${ip//./\\.}[[:space:]]+${fqdn//./\\.}([[:space:]]|$)" "$HOSTS_FILE"
        }

        # getent honours /etc/hosts then DNS (same as ping did) but without sending packets
        resolve_ipv4() {
          timeout "$LOOKUP_TIMEOUT" getent ahostsv4 "$1" 2>/dev/null | awk '{print $1}' | sort -u
        }

        inspect_level() {
          local level="$1"
          local json="${BACKEND_JSON[$level]}"
          local decision_file="$WORK_DIR/$level.decision"
          printf 'none\n' > "$decision_file"

          if [[ -z "$json" || "$json" == "{}" ]]; then
            echo "  status          : skipped (no backend configuration provided)"
            return 0
          fi

          local fqdn ip name container
          fqdn=$(jq -r '.fqdn // empty' <<<"$json")
          ip=$(jq -r '.private_ip_address // empty' <<<"$json")
          name=$(jq -r '.name // empty' <<<"$json")
          container=$(jq -r '.tf_backend_container // empty' <<<"$json")

          echo "  storage account : ${name:-<unset>}"
          echo "  container       : ${container:-<unset>}"
          echo "  fqdn            : ${fqdn:-<unset>}"
          echo "  expected ip     : ${ip:-<unset>}"

          if [[ -z "$fqdn" || -z "$ip" ]]; then
            echo "  status          : WARNING - json must provide both 'fqdn' and 'private_ip_address'"
            printf 'warn\n' > "$decision_file"
            return 0
          fi

          if hosts_entry_present "$ip" "$fqdn"; then
            echo "  status          : OK (hosts entry already present, no lookup needed)"
            return 0
          fi

          local resolved
          resolved=$(resolve_ipv4 "$fqdn" | paste -sd' ' -) || true

          local match=false r
          for r in $resolved; do
            [[ "$r" == "$ip" ]] && { match=true; break; }
          done

          if [[ "$match" == true ]]; then
            echo "  resolved ip     : $resolved"
            echo "  status          : OK (dns already returns expected ip)"
            return 0
          fi

          if [[ -z "$resolved" ]]; then
            echo "  resolved ip     : <none> (no answer within ${LOOKUP_TIMEOUT}s)"
          else
            echo "  resolved ip     : $resolved (does not match expected)"
          fi
          echo "  status          : hosts entry required"
          printf 'add\t%s\t%s\n' "$ip" "$fqdn" > "$decision_file"
        }

        echo "INFO: inspecting backend endpoints for ${#LEVELS[@]} levels (lookup timeout ${LOOKUP_TIMEOUT}s, run in parallel)"

        for level in "${LEVELS[@]}"; do
          inspect_level "$level" > "$WORK_DIR/$level.log" 2>&1 &
        done
        wait

        pending_entries=()
        warned=false

        for level in "${LEVELS[@]}"; do
          echo ""
          echo "=== $level ==="
          cat "$WORK_DIR/$level.log"

          decision=$(<"$WORK_DIR/$level.decision")
          case "${decision%%$'\t'*}" in
            add)
              IFS=$'\t' read -r _ d_ip d_fqdn <<<"$decision"
              pending_entries+=("$d_ip"$'\t'"$d_fqdn")
              ;;
            warn) warned=true ;;
          esac
        done

        echo ""
        if (( ${#pending_entries[@]} > 0 )); then
          echo "=== applying ${#pending_entries[@]} hosts entries ==="
          printf '%s\n' "${pending_entries[@]}" | sudo tee -a "$HOSTS_FILE" > /dev/null

          for entry in "${pending_entries[@]}"; do
            e_ip="${entry%%$'\t'*}"
            e_fqdn="${entry##*$'\t'}"
            if hosts_entry_present "$e_ip" "$e_fqdn"; then
              echo "  verified: $e_ip -> $e_fqdn"
            else
              echo "##vso[task.logissue type=error]Failed to verify hosts entry: $e_ip -> $e_fqdn"
              exit 1
            fi
          done
        else
          echo "=== no hosts file changes required ==="
        fi

        if [[ "$warned" == true ]]; then
          echo "##vso[task.logissue type=warning]One or more backend levels had incomplete configuration - see per-level output above"
        fi
